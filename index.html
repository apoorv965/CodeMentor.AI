<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google-adsense-account" content="ca-pub-3482537894700896">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeMentor-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1116; --panel:#161b22; --line:#262c36; --paper:#e8eaed;
    --muted:#8b94a3; --signal:#7c5cff; --signal2:#37e2c4; --warn:#ff8a5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--paper);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--signal); color:var(--ink);}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .muted{color:var(--muted);}
  .signal{color:var(--signal);}
  .signal2{color:var(--signal2);}
  .warn{color:var(--warn);}
  .text-glow{text-shadow:0 0 24px rgba(124,92,255,.35);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    font-weight:500; border-radius:8px; padding:.65rem 1.3rem; border:1px solid transparent;
    cursor:pointer; font-size:.9rem; transition:opacity .15s, border-color .15s, color .15s; font-family:inherit;
  }
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary{background:var(--signal); color:var(--ink);}
  .btn-primary:hover:not(:disabled){opacity:.88;}
  .btn-ghost{background:transparent; color:var(--paper); border-color:var(--line);}
  .btn-ghost:hover:not(:disabled){border-color:var(--signal);}
  .btn-danger-ghost{background:transparent; color:var(--paper); border-color:var(--line);}
  .btn-danger-ghost:hover:not(:disabled){border-color:var(--warn); color:var(--warn);}
  input,select,textarea{
    font-family:inherit; background:var(--panel); border:1px solid var(--line); color:var(--paper);
    border-radius:8px; padding:.55rem .75rem; font-size:.9rem; outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--signal);}
  .container{max-width:1100px; margin:0 auto; padding:0 1.5rem;}
  .container-sm{max-width:420px; margin:0 auto; padding:0 1.5rem;}
  .container-md{max-width:760px; margin:0 auto; padding:0 1.5rem;}

  /* Nav */
  header.nav{
    border-bottom:1px solid var(--line); background:rgba(14,17,22,.95); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:50;
  }
  .nav-inner{max-width:1100px; margin:0 auto; padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.05rem; letter-spacing:-.02em; cursor:pointer;}
  .nav-links{display:flex; gap:1.5rem; font-size:.88rem;}
  .nav-links a{color:var(--muted); transition:color .15s; cursor:pointer;}
  .nav-links a:hover, .nav-links a.active{color:var(--paper);}
  .nav-right{display:flex; gap:.75rem; align-items:center;}
  @media (max-width:720px){ .nav-links{display:none;} }

  /* Landing */
  .hero{display:grid; grid-template-columns:1fr; gap:3rem; padding:4.5rem 0 3.5rem;}
  @media (min-width:860px){ .hero{grid-template-columns:1fr 1fr; align-items:center;} }
  .hero h1{font-family:'JetBrains Mono',monospace; font-size:2.3rem; line-height:1.15; font-weight:700; margin:1rem 0;}
  @media (min-width:640px){ .hero h1{font-size:2.9rem;} }
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:.85rem; color:var(--signal); margin:0;}
  .hero p.lead{color:var(--muted); font-size:1.05rem; line-height:1.65; max-width:32rem; margin-top:1.2rem;}
  .hero .cta-row{display:flex; gap:1rem; margin-top:1.8rem; flex-wrap:wrap;}
  .code-panel{padding:1.2rem; font-family:'JetBrains Mono',monospace; font-size:.82rem; overflow-x:auto;}
  .dots{display:flex; gap:.4rem; margin-bottom:1rem;}
  .dot{width:11px; height:11px; border-radius:50%;}
  .code-row{position:relative;}
  .code-line{white-space:pre; padding:.1rem 0; color:var(--paper);}
  .line-no{color:var(--muted); user-select:none; margin-right:.9rem;}
  .code-note{margin-left:2.1rem; margin-bottom:.5rem; margin-top:.25rem; color:var(--signal2); font-size:.72rem;
    border-left:2px solid rgba(55,226,196,.4); padding:.3rem .7rem; background:rgba(55,226,196,.05);}
  .features{padding:3.5rem 0; border-top:1px solid var(--line);}
  .feature-grid{display:grid; grid-template-columns:1fr; gap:1.25rem;}
  @media (min-width:720px){ .feature-grid{grid-template-columns:1fr 1fr;} }
  .feature-grid .card{padding:1.5rem;}
  .feature-grid h3{font-family:'JetBrains Mono',monospace; font-size:1.15rem; margin:.5rem 0 .4rem;}
  .feature-grid p{color:var(--muted); font-size:.88rem; line-height:1.6; margin:0;}
  .cta-section{padding:3.5rem 0; border-top:1px solid var(--line); text-align:center;}
  .cta-section h2{font-family:'JetBrains Mono',monospace; font-size:1.5rem; margin-bottom:1rem;}

  /* Forms */
  .form-page{padding:5rem 0;}
  .form-page h1{font-family:'JetBrains Mono',monospace; font-size:1.5rem; margin-bottom:.25rem;}
  .form-page .sub{color:var(--muted); font-size:.88rem; margin-bottom:1.8rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:.3rem;}
  .field input{width:100%;}
  .form-err{color:var(--warn); font-size:.85rem; margin-bottom:.5rem;}
  .form-page button[type=submit]{width:100%;}
  .form-foot{color:var(--muted); font-size:.85rem; margin-top:1.3rem;}
  .auth-divider{display:flex; align-items:center; gap:.8rem; color:var(--muted); font-size:.78rem; margin:0 0 1.1rem;}
  .auth-divider::before, .auth-divider::after{content:""; flex:1; height:1px; background:var(--line);}

  /* Dashboard */
  .page{padding:2.8rem 0;}
  .page h1{font-family:'JetBrains Mono',monospace; font-size:1.5rem; margin-bottom:.25rem;}
  .page .sub{color:var(--muted); margin-bottom:2rem; font-size:.92rem;}
  .stat-grid{display:grid; grid-template-columns:1fr; gap:1rem; margin-bottom:2.2rem;}
  @media (min-width:640px){ .stat-grid{grid-template-columns:repeat(3,1fr);} }
  .stat-grid .card{padding:1.4rem;}
  .stat-grid .card p:first-child{color:var(--muted); font-size:.85rem; margin:0;}
  .stat-grid .card p.val{font-family:'JetBrains Mono',monospace; font-size:1.9rem; font-weight:700; margin:.3rem 0 0;}

  /* Practice */
  .problem-row{padding:1.1rem 1.3rem; display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem; cursor:pointer; transition:border-color .15s;}
  .problem-row:hover{border-color:var(--signal);}
  .problem-row h3{margin:0 0 .35rem; font-weight:500;}
  .tag-row{display:flex; gap:.4rem; flex-wrap:wrap;}
  .tag{font-size:.72rem; color:var(--muted); background:var(--ink); border:1px solid var(--line); border-radius:5px; padding:.15rem .5rem;}
  .diff{font-family:'JetBrains Mono',monospace; font-size:.85rem; white-space:nowrap; margin-left:1rem;}
  .diff-easy{color:var(--lc-easy, var(--signal2));}
  .diff-medium{color:var(--lc-medium, var(--warn));}
  .diff-hard{color:var(--lc-hard, var(--warn));}
  .solved-badge{font-size:.72rem; color:var(--signal2); border:1px solid rgba(55,226,196,.4); border-radius:5px; padding:.15rem .5rem; margin-left:.5rem;}

  /* Editor (scratchpad) */
  .editor-grid{display:grid; grid-template-columns:1fr; gap:1.2rem;}
  @media (min-width:980px){ .editor-grid{grid-template-columns:1fr 1fr;} }
  .editor-wrap{position:relative; overflow:hidden;}
  .editor-toolbar{display:flex; justify-content:space-between; align-items:center; padding:.6rem .8rem; border-bottom:1px solid var(--line);}
  textarea.code-input{
    width:100%; height:440px; resize:vertical; border:none; border-radius:0;
    font-family:'JetBrains Mono',monospace; font-size:.85rem; line-height:1.55; padding:1rem;
    background:var(--panel); tab-size:4;
  }
  .mentor-panel{padding:1.2rem; display:flex; flex-direction:column;}
  .tab-row{display:flex; gap:.4rem; margin-bottom:1rem; border-bottom:1px solid var(--line); padding-bottom:1rem; flex-wrap:wrap;}
  .tab-btn{background:none; border:none; color:var(--muted); font-family:inherit; font-size:.85rem; font-weight:500; padding:.45rem .8rem; border-radius:6px; cursor:pointer;}
  .tab-btn.active{background:var(--signal); color:var(--ink);}
  .tab-btn:not(.active):hover{color:var(--paper);}
  .mentor-body{flex:1; overflow-y:auto; font-family:'JetBrains Mono',monospace; font-size:.85rem; line-height:1.6; max-height:420px;}
  .mentor-body p{white-space:pre-wrap; margin:0 0 .8rem;}
  .fix-block{background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:.8rem; white-space:pre-wrap; overflow-x:auto; margin-top:.4rem;}
  .status-dot{font-size:.85rem; margin-bottom:.6rem; display:block;}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(124,92,255,.25); border-top-color:var(--signal); border-radius:50%; animation:spin .7s linear infinite; margin-right:.5rem; vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .run-output{background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:.7rem; margin-top:.8rem; font-size:.78rem; max-height:150px; overflow:auto; white-space:pre-wrap;}

  /* Profile */
  .kv{margin-bottom:1rem;}
  .kv .k{color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.2rem;}
  .kv .v{font-family:'JetBrains Mono',monospace; font-size:.9rem;}

  footer.site{border-top:1px solid var(--line); padding:2rem 0; text-align:center; color:var(--muted); font-size:.8rem;}
  .toast{position:fixed; bottom:1.2rem; right:1.2rem; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--signal2); border-radius:8px; padding:.8rem 1.1rem; font-size:.85rem; box-shadow:0 8px 30px rgba(0,0,0,.4); z-index:200; max-width:320px;}
  .toast.err{border-left-color:var(--warn);}

  /* ================= LeetCode-style problem workspace ================= */
  :root{
    --lc-orange:#ffa116; --lc-easy:#00af9b; --lc-medium:#ffc01e; --lc-hard:#ff375f;
    --lc-bg:#0e1116; --lc-panel2:#1d222b; --lc-line2:#2a3140;
  }
  .lc-shell{ display:flex; flex-direction:column; height:calc(100vh - 65px); background:var(--lc-bg); }
  .lc-topbar{ display:flex; align-items:center; justify-content:space-between; padding:.7rem 1.2rem; border-bottom:1px solid var(--lc-line2); flex-wrap:wrap; gap:.7rem; background:var(--panel); }
  .lc-title{ font-family:'JetBrains Mono',monospace; font-size:.92rem; display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
  .lc-back{ font-size:.8rem; color:var(--muted); cursor:pointer; }
  .lc-back:hover{ color:var(--paper); }
  .lc-pill{ font-size:.7rem; padding:.2rem .6rem; border-radius:999px; font-family:'JetBrains Mono',monospace; text-transform:capitalize; }
  .lc-pill.easy{ color:var(--lc-easy); background:rgba(0,175,155,.12); }
  .lc-pill.medium{ color:var(--lc-medium); background:rgba(255,192,30,.12); }
  .lc-pill.hard{ color:var(--lc-hard); background:rgba(255,55,95,.12); }
  .lc-run-row{ display:flex; gap:.55rem; align-items:center; flex-wrap:wrap; }
  .lc-btn{ font-family:'JetBrains Mono',monospace; font-size:.78rem; padding:.5rem 1rem; border-radius:6px; border:1px solid var(--lc-line2); background:var(--lc-panel2); color:var(--paper); cursor:pointer; display:inline-flex; align-items:center; gap:.4rem; transition:border-color .15s,color .15s,opacity .15s; }
  .lc-btn:hover:not(:disabled){ border-color:var(--lc-orange); color:var(--lc-orange); }
  .lc-btn.submit{ background:var(--lc-orange); color:#14110a; border-color:var(--lc-orange); font-weight:700; }
  .lc-btn.submit:hover:not(:disabled){ opacity:.88; color:#14110a; }
  .lc-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .lc-body{ flex:1; display:flex; min-height:0; padding:.6rem; gap:0; }
  .lc-pane{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); overflow:hidden; }
  .lc-right{ flex-direction:column; }
  .lc-splitter-v{ width:10px; cursor:col-resize; background:transparent; flex-shrink:0; position:relative; }
  .lc-splitter-v::after{ content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--lc-line2); transform:translateX(-50%); }
  .lc-splitter-v:hover::after, .lc-splitter-v.dragging::after{ background:var(--lc-orange); }
  .lc-splitter-h{ height:10px; cursor:row-resize; background:transparent; flex-shrink:0; position:relative; }
  .lc-splitter-h::after{ content:""; position:absolute; top:50%; left:0; right:0; height:2px; background:var(--lc-line2); transform:translateY(-50%); }
  .lc-splitter-h:hover::after, .lc-splitter-h.dragging::after{ background:var(--lc-orange); }
  .lc-tabbar{ display:flex; gap:.2rem; padding:.5rem .6rem; border-bottom:1px solid var(--lc-line2); flex-shrink:0; }
  .lc-tab{ font-family:'JetBrains Mono',monospace; font-size:.76rem; padding:.4rem .8rem; border-radius:6px; color:var(--muted); cursor:pointer; border:none; background:none; }
  .lc-tab.active{ background:var(--lc-panel2); color:var(--paper); }
  .lc-tab:hover:not(.active){ color:var(--paper); }
  .lc-tab.warn{ color:var(--warn); }
  .lc-scroll{ flex:1; overflow-y:auto; padding:1.3rem 1.4rem; font-size:.9rem; line-height:1.65; }
  .lc-scroll h2{ font-family:'JetBrains Mono',monospace; font-size:1.15rem; margin:.2rem 0 .9rem; }
  .lc-scroll p{ color:var(--muted); margin:0 0 1rem; }
  .lc-tag-row{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:1rem; }
  .lc-editor-header{ display:flex; align-items:center; justify-content:space-between; padding:.55rem .9rem; border-bottom:1px solid var(--lc-line2); flex-shrink:0; }
  .lc-console-tabs{ display:flex; gap:.3rem; padding:.5rem .6rem; border-bottom:1px solid var(--lc-line2); flex-shrink:0; }
  .lc-case-row{ display:flex; gap:.4rem; padding:.7rem .8rem 0; flex-wrap:wrap; }
  .lc-case-btn{ font-family:'JetBrains Mono',monospace; font-size:.73rem; padding:.35rem .8rem; border-radius:6px; border:1px solid var(--lc-line2); background:var(--lc-panel2); color:var(--muted); cursor:pointer; }
  .lc-case-btn.active{ color:var(--paper); border-color:var(--lc-orange); }
  .lc-case-btn.warn{ color:var(--warn); border-color:rgba(255,138,92,.4); }
  .lc-case-body{ padding:.6rem .8rem 1rem; overflow-y:auto; flex:1; }
  .lc-case-label{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:.7rem 0 .35rem; }
  .lc-case-value{ font-family:'JetBrains Mono',monospace; font-size:.82rem; background:var(--lc-panel2); border:1px solid var(--lc-line2); border-radius:6px; padding:.6rem .75rem; white-space:pre-wrap; word-break:break-word; }
  .lc-result-summary{ font-family:'JetBrains Mono',monospace; font-size:.95rem; font-weight:700; padding:.9rem .9rem 0; }
  textarea.lc-code-input{ flex:1; width:100%; resize:none; border:none; border-radius:0; font-family:'JetBrains Mono',monospace; font-size:.85rem; line-height:1.55; padding:1rem; background:var(--panel); tab-size:4; }
  @media (max-width:860px){
    .lc-body{ flex-direction:column; }
    .lc-splitter-v{ display:none; }
    .lc-left{ flex-basis:auto !important; max-height:42vh; }
    .lc-right{ flex:1; }
  }

  /* ---- LeetCode-style practice list ---- */
  .lc-list-wrap{ max-width:900px; margin:0 auto; }
  .lc-progress-row{ display:flex; align-items:center; gap:.9rem; margin-bottom:1.5rem; }
  .lc-progress-bar{ flex:1; height:6px; border-radius:999px; background:var(--lc-panel2); overflow:hidden; }
  .lc-progress-fill{ height:100%; background:var(--lc-orange); border-radius:999px; transition:width .25s; }
  .lc-list-toolbar{ display:flex; gap:.55rem; margin-bottom:1.2rem; flex-wrap:wrap; align-items:center; }
  .lc-search{ flex:1; min-width:200px; }
  .lc-filter-chip{ font-family:'JetBrains Mono',monospace; font-size:.76rem; padding:.42rem .9rem; border-radius:999px; border:1px solid var(--lc-line2); background:var(--lc-panel2); color:var(--muted); cursor:pointer; white-space:nowrap; transition:border-color .15s,color .15s; }
  .lc-filter-chip:hover{ color:var(--paper); }
  .lc-filter-chip.active{ border-color:var(--lc-orange); color:var(--lc-orange); }
  .lc-table{ width:100%; border-collapse:collapse; }
  .lc-table thead th{ text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:.7rem .9rem; border-bottom:1px solid var(--lc-line2); }
  .lc-table tbody tr{ cursor:pointer; transition:background .12s; }
  .lc-table tbody tr:hover{ background:var(--lc-panel2); }
  .lc-table tbody tr:not(:last-child) td{ border-bottom:1px solid var(--lc-line2); }
  .lc-table tbody td{ padding:.8rem .9rem; font-size:.88rem; vertical-align:middle; }
  .lc-status-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .lc-status-dot.solved{ background:var(--lc-easy); box-shadow:0 0 0 3px rgba(0,175,155,.15); }
  .lc-status-dot.unsolved{ background:var(--lc-line2); }
  .lc-title-cell{ display:flex; align-items:center; gap:.6rem; font-weight:500; }
  .lc-tag-inline{ font-size:.68rem; color:var(--muted); background:var(--lc-panel2); border:1px solid var(--lc-line2); border-radius:5px; padding:.1rem .45rem; margin-right:.3rem; display:inline-block; margin-top:.35rem; }
  @media (max-width:640px){
    .lc-table thead{ display:none; }
    .lc-table td:first-child{ display:none; }
  }
</style>

<body>
<div id="nav"></div>
<main id="app"></main>
<footer class="site">codementor.ai — running entirely client-side, code executes in your browser, mentor calls go straight to Claude</footer>
<div id="toast-root"></div>

<script>
/* ============================================================
   CodeMentor-AI — single-file build
   In-memory + window.storage backed "backend": auth, problems,
   submissions and progress all live client-side. AI mentor calls
   go directly to the Claude API. Code actually executes in the
   browser (native JS, and Python via Skulpt).
   ============================================================ */

// ---------- Google Sign-In config ----------
// To enable real "Continue with Google": create an OAuth Client ID at
// https://console.cloud.google.com/apis/credentials (type: Web application),
// add this page's exact origin under "Authorized JavaScript origins", then
// paste the client ID below. Until it's set, the button shows a setup notice
// instead of failing silently.
const GOOGLE_CLIENT_ID = "966155426799-09uv4g34njb844b8epk8q8kk7p7p1727.apps.googleusercontent.com";
const GOOGLE_CONFIGURED = GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith("YOUR_");

let googleScriptPromise = null;
function loadGoogleScript(){
  if(googleScriptPromise) return googleScriptPromise;
  googleScriptPromise = new Promise((resolve, reject) => {
    if(window.google && window.google.accounts && window.google.accounts.id) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Could not load Google Sign-In."));
    document.head.appendChild(s);
  });
  return googleScriptPromise;
}

function decodeJwt(token){
  const payload = token.split(".")[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,"+").replace(/_/g,"/")).split("").map(c =>
    "%" + c.charCodeAt(0).toString(16).padStart(2,"0")).join(""));
  return JSON.parse(json);
}

async function initGoogleButton(){
  const holder = document.getElementById("google-btn-holder");
  if(!holder) return;
  if(!GOOGLE_CONFIGURED){
    holder.innerHTML = `<p class="muted" style="font-size:.78rem; line-height:1.5;">Google sign-in isn't configured yet — set <code class="mono">GOOGLE_CLIENT_ID</code> at the top of the script to a client ID from Google Cloud Console (with this page's origin as an authorized JavaScript origin) to turn this on.</p>`;
    return;
  }
  try{
    await loadGoogleScript();
    window.google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
    });
    window.google.accounts.id.renderButton(holder, {
      theme: "filled_black", size: "large", shape: "pill", width: 320, text: "continue_with",
    });
  }catch(err){
    holder.innerHTML = `<p class="warn" style="font-size:.8rem;">${escapeHtml(err.message || "Google Sign-In failed to load.")}</p>`;
  }
}

async function handleGoogleCredential(response){
  try{
    const profile = decodeJwt(response.credential);
    const users = await getUsers();
    let user = users.find(u => u.googleId === profile.sub || u.email === profile.email);
    if(!user){
      let username = (profile.email || "user").split("@")[0].replace(/[^a-zA-Z0-9_]/g, "");
      let candidate = username, n = 1;
      while(users.some(u => u.username === candidate)) candidate = username + (n++);
      user = { id: uid(), username: candidate, email: profile.email, passwordHash: null, googleId: profile.sub, name: profile.name, picture: profile.picture, provider: "google" };
      users.push(user);
      await saveUsers(users);
      toast(`Welcome, ${user.username}!`);
    } else {
      if(!user.googleId){ user.googleId = profile.sub; user.picture = profile.picture; await saveUsers(users); }
      toast(`Welcome back, ${user.username}!`);
    }
    await setSession({ userId: user.id });
    CURRENT_USER = user;
    go("dashboard");

// ---------- tiny in-memory fallback store ----------
const memCache = {};
async function storeGet(key, shared=false){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){
    return memCache[key] !== undefined ? memCache[key] : null;
  }
}
async function storeSet(key, value, shared=false){
  memCache[key] = value;
  try{ await window.storage.set(key, JSON.stringify(value), shared); }catch(e){ /* in-memory only */ }
}

// ---------- generic stdin parsing (JS side, mirrors the python-side parsing used to author tests) ----------
function parseArg(raw, type){
  raw = raw == null ? "" : raw;
  switch(type){
    case "int": return raw.trim();
    case "float": return raw.trim();
    case "string": return raw;
    case "bool": return raw.trim().toLowerCase() === "true" ? "True" : "False";
    case "int[]": {
      const t = raw.trim();
      return "[" + (t.length ? t.split(/\s+/).join(", ") : "") + "]";
    }
    case "string[]": {
      const t = raw.trim();
      const words = t.length ? t.split(/\s+/) : [];
      return "[" + words.map(w => JSON.stringify(w)).join(", ") + "]";
    }
    case "int[][]": {
      const t = raw.trim();
      if(!t.length) return "[]";
      const rows = t.split(";").map(row => "[" + row.trim().split(/\s+/).join(", ") + "]");
      return "[" + rows.join(", ") + "]";
    }
    default: return raw;
  }
}

// builds a python literal for an argument, e.g. int -> "9", string -> "\"hi\"", int[] -> "[1, 2]"
function toPyLiteral(raw, type){
  switch(type){
    case "string": return JSON.stringify(raw);
    default: return parseArg(raw, type);
  }
}

// builds the python snippet appended after user code to call their
// function with parsed test-case args and print a comparable value.
// This is fully generic across every problem -- driven entirely by
// each problem's paramTypes / returnType, never hardcoded per-id.
function buildHarness(problem, test){
  const lines = test.input.split("\n");
  const paramTypes = problem.paramTypes || [];
  const args = paramTypes.map((t, i) => toPyLiteral(lines[i] !== undefined ? lines[i] : "", t));
  const call = `${problem.fnName}(${args.join(", ")})`;

  let printCode;
  switch(problem.returnType){
    case "int[]":
    case "string[]":
      printCode = `print(' '.join(str(x) for x in __r))`;
      break;
    case "int[][]":
      printCode = `print(';'.join(' '.join(str(x) for x in row) for row in __r))`;
      break;
    case "bool":
    case "int":
    case "float":
    case "string":
    default:
      printCode = `print(__r)`;
  }
  return `\n__r = ${call}\n${printCode}\n`;
}

async function getProblems(){

  if(!p || !Array.isArray(p) || p.length < SEED_PROBLEMS.length){

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// ---------- Claude API mentor calls ----------
async function callClaude(system, userPrompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: system,
      messages: [{ role: "user", content: userPrompt }],
    }),
  });
  if(!response.ok){ throw new Error("Mentor request failed (" + response.status + ")"); }
  const data = await response.json();
  return (data.content || []).map(b => b.type === "text" ? b.text : "").join("\n").trim();
}

async function explainCode(code, language, level){
  const system = `You are a patient, encouraging coding mentor. Explain code clearly for a ${level} learner. Use short paragraphs and, where useful, numbered steps. Never just restate the code line-by-line without context — explain the why and the underlying concept. Keep it under 220 words.`;
  const user = `Language: ${language}\n\nCode:\n\`\`\`${language}\n${code}\n\`\`\`\n\nExplain what this code does and why it's written this way.`;
  return await callClaude(system, user);
}

async function findBug(code, language, runtimeOutput){
  const system = `You are an expert debugger and coding mentor. Analyze the given code for bugs. If runtime output (stdout/stderr) is provided, use it as ground truth. Respond in this exact format with no extra preamble:\nHAS_BUG: yes|no\nDIAGNOSIS: <clear explanation of the bug and why it happens>\nFIX: <corrected code or clear instructions to fix it>`;
  const context = runtimeOutput ? `\n\nActual runtime output:\n${runtimeOutput}` : "";
  const user = `Language: ${language}\n\nCode:\n\`\`\`${language}\n${code}\n\`\`\`${context}`;
  const raw = await callClaude(system, user);
  const hasBugMatch = raw.match(/HAS_BUG:\s*(yes|no)/i);
  const diagMatch = raw.match(/DIAGNOSIS:\s*([\s\S]*?)(?:\nFIX:|$)/i);
  const fixMatch = raw.match(/FIX:\s*([\s\S]*)$/i);
  return {
    has_bug: hasBugMatch ? hasBugMatch[1].toLowerCase() === "yes" : /bug/i.test(raw),
    diagnosis: diagMatch ? diagMatch[1].trim() : raw,
    suggested_fix: fixMatch ? fixMatch[1].trim() : "",
  };
}

async function generateHint(problemDescription, code, hintLevel){
  const guidance = {
    1: "Give only a gentle nudge pointing at the general area of the problem. Do NOT reveal the approach or any code.",
    2: "Explain the general strategy or algorithm they should consider, without writing code.",
    3: "Give a near-complete hint, including pseudocode, but stop short of the full working solution.",
  }[hintLevel] || "Give a gentle nudge only.";
  const system = `You are a Socratic coding mentor. Your goal is to help the learner discover the solution themselves, not to solve it for them. ${guidance} Keep it under 150 words.`;
  const user = `Problem:\n${problemDescription}\n\nLearner's current code:\n\`\`\`\n${code}\n\`\`\`\n\nGive a hint at level ${hintLevel}.`;
  return await callClaude(system, user);
}

// ---------- code execution ----------
function runJS(code){
  const logs = [];
  const fakeConsole = { log: (...a) => logs.push(a.map(x => typeof x === "object" ? JSON.stringify(x) : String(x)).join(" ")) };
  try{
    const fn = new Function("console", code);
    fn(fakeConsole);
    return { stdout: logs.join("\n"), stderr: "", ok: true };
  }catch(err){
    return { stdout: logs.join("\n"), stderr: String(err && err.message ? err.message : err), ok: false };
  }
}

let skulptLoadPromise = null;
function loadSkulpt(){
  if(skulptLoadPromise) return skulptLoadPromise;
  skulptLoadPromise = new Promise((resolve, reject) => {
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js";
      s2.onload = () => resolve();
      s2.onerror = () => reject(new Error("Could not load the Python runtime (Skulpt)."));
      document.head.appendChild(s2);
    };
    s1.onerror = () => reject(new Error("Could not load the Python runtime (Skulpt)."));
    document.head.appendChild(s1);
  });
  return skulptLoadPromise;
}

async function runPython(code){
  await loadSkulpt();
  let out = "";
  Sk.configure({
    output: (text) => { out += text; },
    read: (x) => {
      if(Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    },
    __future__: Sk.python3,
  });
  try{
    await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
    return { stdout: out, stderr: "", ok: true };
  }catch(err){
    return { stdout: out, stderr: (err && err.toString) ? err.toString() : String(err), ok: false };
  }
}

async function runCode(code, language){
  if(language === "python") return await runPython(code);
  if(language === "javascript") return await runJS(code);
  return { stdout: "", stderr: `Live execution in this demo only supports Python and JavaScript. "${language}" is supported for Explain / Hint, but not Find bug's live run.`, ok: false, unsupported: true };
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const mode = e.target.dataset.mode;
  const errEl = document.getElementById("auth-err");
  const btn = document.getElementById("auth-submit");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = mode === "login" ? "Logging in…" : "Creating account…";
  try{
    const email = document.getElementById("f-email").value.trim().toLowerCase();
    const password = document.getElementById("f-password").value;
    const users = await getUsers();

    if(mode === "signup"){
      const username = document.getElementById("f-username").value.trim();
      if(users.some(u => u.email === email)) throw new Error("An account with that email already exists.");
      if(users.some(u => u.username === username)) throw new Error("That username is taken.");
      const passwordHash = await hashPassword(password);
      const user = { id: uid(), username, email, passwordHash, provider: "password" };
      users.push(user);
      await saveUsers(users);
      await setSession({ userId: user.id });
      CURRENT_USER = user;
      toast(`Welcome, ${username}!`);
      go("dashboard");
    } else {
      const existing = users.find(u => u.email === email);
      if(existing && !existing.passwordHash) throw new Error("This account uses Google sign-in — use the Google button above instead.");
      const passwordHash = await hashPassword(password);
      const user = users.find(u => u.email === email && u.passwordHash === passwordHash);
      if(!user) throw new Error("Invalid email or password.");
      await setSession({ userId: user.id });
      CURRENT_USER = user;
      toast(`Welcome back, ${user.username}!`);
      go("dashboard");
    }
  }catch(err){
    errEl.textContent = err.message || "Something went wrong.";
    btn.disabled = false;
    btn.textContent = mode === "login" ? "Log in" : "Sign up";
  }
}

    if(s.tab === "explain"){
      s.result = await explainCode(s.code, s.language, s.level);
    } else if(s.tab === "bugfinder"){
      let runtimeOutput = null;
      if(s.language === "python" || s.language === "javascript"){
        const run = await runCode(s.code, s.language);
        runtimeOutput = (run.stdout ? "stdout:\n" + run.stdout : "") + (run.stderr ? "\nstderr:\n" + run.stderr : "");
        runtimeOutput = runtimeOutput.trim() || "(no output)";
      }
      const res = await findBug(s.code, s.language, runtimeOutput);
      res.runtimeOutput = runtimeOutput;
      s.result = res;
    } else if(s.tab === "hint"){
      s.result = await generateHint("General code review of the snippet in the editor.", s.code, s.hintLevel);
    }
  }catch(err){
    s.error = err.message || "Something went wrong talking to the mentor.";
  }finally{
    s.loading = false;
    renderEditor(app);
  }
}

// ---------- Practice list (LeetCode-style problem table) ----------
let practiceState = { search: "", difficulty: "all", status: "all" };

async function renderPractice(app){
  const problems = await getProblems();
  const progress = await getProgress(CURRENT_USER.id);
  renderPracticeList(app, problems, progress);
}

function renderPracticeList(app, problems, progress){
  const s = practiceState;
  const solvedCount = problems.filter(p => progress[p.id] && progress[p.id].solved).length;

  const filtered = problems.filter(p => {
    if(s.difficulty !== "all" && p.difficulty !== s.difficulty) return false;
    const solved = !!(progress[p.id] && progress[p.id].solved);
    if(s.status === "solved" && !solved) return false;
    if(s.status === "unsolved" && solved) return false;
    if(s.search){
      const q = s.search.toLowerCase();
      const hay = (p.title + " " + p.tags.join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const statusFilters = [["all","All"],["solved","Solved"],["unsolved","Unsolved"]];
  const diffFilters = [["all","All levels"],["easy","Easy"],["medium","Medium"],["hard","Hard"]];

  app.innerHTML = `
  <div class="page">
    <div class="lc-list-wrap">
      <h1>Practice</h1>
      <p class="sub">Pick a problem. Run it, get stuck, ask for a hint — that's the loop.</p>

      <div class="lc-progress-row">
        <span class="mono muted" style="font-size:.8rem; white-space:nowrap;">${solvedCount} / ${problems.length} solved</span>
        <div class="lc-progress-bar"><div class="lc-progress-fill" style="width:${problems.length ? (solvedCount/problems.length*100) : 0}%;"></div></div>
      </div>

      <div class="lc-list-toolbar">
        <input class="lc-search" id="lc-search" placeholder="Search by title or tag…" value="${escapeHtml(s.search)}" />
        ${statusFilters.map(([v,l]) => `<button class="lc-filter-chip ${s.status===v?'active':''}" data-status="${v}">${l}</button>`).join("")}
        ${diffFilters.map(([v,l]) => `<button class="lc-filter-chip ${s.difficulty===v?'active':''}" data-diff="${v}">${l}</button>`).join("")}
      </div>

      <div class="card" style="overflow:hidden;">
        <table class="lc-table">
          <thead><tr><th style="width:40px;"></th><th>Title</th><th style="width:110px;">Difficulty</th></tr></thead>
          <tbody>
            ${filtered.length ? filtered.map(p => {
              const idx = problems.indexOf(p);
              const solved = !!(progress[p.id] && progress[p.id].solved);
              return `
              <tr onclick="go('practice/${p.id}')">
                <td><span class="lc-status-dot ${solved?'solved':'unsolved'}" title="${solved?'Solved':'Not solved'}"></span></td>
                <td>
                  <div class="lc-title-cell">
                    <span class="mono muted" style="font-size:.78rem;">${idx+1}.</span>
                    <span>${escapeHtml(p.title)}</span>
                  </div>
                  <div>${p.tags.map(t => `<span class="lc-tag-inline">${escapeHtml(t)}</span>`).join("")}</div>
                </td>
                <td><span class="lc-pill ${p.difficulty}">${p.difficulty}</span></td>
              </tr>`;
            }).join("") : `<tr><td colspan="3" class="muted" style="padding:2rem; text-align:center;">No problems match your filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

  const searchEl = document.getElementById("lc-search");
  searchEl.addEventListener("input", (e) => {
    practiceState.search = e.target.value;
    renderPracticeList(app, problems, progress);
    const el = document.getElementById("lc-search");
    el.focus();
    el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => {
    practiceState.status = b.dataset.status; renderPracticeList(app, problems, progress);
  }));
  document.querySelectorAll("[data-diff]").forEach(b => b.addEventListener("click", () => {
    practiceState.difficulty = b.dataset.diff; renderPracticeList(app, problems, progress);
  }));
}

// ============================================================
// Problem workspace — LeetCode-style split view:
// left = description / mentor hint, right = code editor (top)
// + testcase / result console (bottom), with draggable splitters.
// ============================================================
let problemState = {};

function ensureProblemState(problem){
  if(!problemState[problem.id]){
    problemState[problem.id] = {
      code: problem.starter,
      running: false,
      results: null,
      hint: "",
      hintLoading: false,
      hintLevel: 1,
      leftTab: "description",
      consoleTab: "testcase",
      activeCase: 0,
      leftWidth: 42,     // % of lc-body width
      editorHeight: 60,  // % of lc-right height
    };
  }
  return problemState[problem.id];
}

async function renderProblemDetail(app, id){
  const problems = await getProblems();
  const problem = problems.find(p => p.id === id);
  if(!problem){ app.innerHTML = `<div class="page container"><p>Problem not found. <a class="signal" onclick="go('practice')">Back to practice</a></p></div>`; return; }
  const idx = problems.findIndex(p => p.id === id);
  const s = ensureProblemState(problem);

  app.innerHTML = `
  <div class="lc-shell">
    <div class="lc-topbar">
      <div class="lc-title">
        <span class="lc-back" onclick="go('practice')">&larr; Practice</span>
        <span>${idx+1}. ${escapeHtml(problem.title)}</span>
        <span class="lc-pill ${problem.difficulty}">${problem.difficulty}</span>
      </div>
      <div class="lc-run-row">
        <select id="pd-hint-level" class="lc-btn" style="cursor:pointer;">
          <option value="1" ${s.hintLevel===1?"selected":""}>Hint · nudge</option>
          <option value="2" ${s.hintLevel===2?"selected":""}>Hint · strategy</option>
          <option value="3" ${s.hintLevel===3?"selected":""}>Hint · near-solution</option>
        </select>
        <button class="lc-btn" id="pd-hint" ${s.hintLoading?"disabled":""}>${s.hintLoading ? "Thinking…" : "💡 Hint"}</button>
        <button class="lc-btn" id="pd-run" ${s.running?"disabled":""}>${s.running ? `<span class="spinner"></span>` : "▶"} Run</button>
        <button class="lc-btn submit" id="pd-submit" ${s.running?"disabled":""}>Submit</button>
      </div>
    </div>
    <div class="lc-body" id="lc-body">
      <div class="card lc-pane lc-left" id="lc-left" style="flex:0 0 ${s.leftWidth}%;">
        <div class="lc-tabbar">
          <button class="lc-tab ${s.leftTab==='description'?'active':''}" data-lefttab="description">Description</button>
          <button class="lc-tab ${s.leftTab==='hint'?'active':''}" data-lefttab="hint">Mentor Hint</button>
        </div>
        <div class="lc-scroll">${s.leftTab === 'description' ? renderProblemDescription(problem) : renderHintPanel(s)}</div>
      </div>
      <div class="lc-splitter-v" id="lc-splitter-v"></div>
      <div class="lc-pane lc-right" id="lc-right" style="flex:1;">
        <div class="card lc-pane" id="lc-editor-pane" style="flex:0 0 ${s.editorHeight}%;">
          <div class="lc-editor-header">
            <span class="muted mono" style="font-size:.75rem;">${problem.fnName}.py</span>
            <span class="muted mono" style="font-size:.72rem;">Python3</span>
          </div>
          <textarea class="lc-code-input" id="pd-code" spellcheck="false">${escapeHtml(s.code)}</textarea>
        </div>
        <div class="lc-splitter-h" id="lc-splitter-h"></div>
        <div class="card lc-pane" id="lc-console-pane" style="flex:1;">
          <div class="lc-console-tabs">
            <button class="lc-tab ${s.consoleTab==='testcase'?'active':''}" data-consoletab="testcase">Testcase</button>
            <button class="lc-tab ${s.consoleTab==='result'?'active':''} ${s.results && !s.results.every(r=>r.pass) ? 'warn':''}" data-consoletab="result">Result</button>
          </div>
          <div style="flex:1; overflow-y:auto;" id="lc-console-body">${renderConsoleBody(problem, s)}</div>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById("pd-code").addEventListener("input", e => { s.code = e.target.value; });
  document.getElementById("pd-hint-level").addEventListener("change", e => { s.hintLevel = parseInt(e.target.value,10); });
  document.getElementById("pd-run").addEventListener("click", () => runProblemCode(app, problem, s, false));
  document.getElementById("pd-submit").addEventListener("click", () => runProblemCode(app, problem, s, true));
  document.getElementById("pd-hint").addEventListener("click", () => getProblemHint(app, problem, s));
  document.querySelectorAll("[data-lefttab]").forEach(b => b.addEventListener("click", () => { s.leftTab = b.dataset.lefttab; renderProblemDetail(app, id); }));
  document.querySelectorAll("[data-consoletab]").forEach(b => b.addEventListener("click", () => { s.consoleTab = b.dataset.consoletab; renderProblemDetail(app, id); }));
  document.querySelectorAll("[data-case]").forEach(b => b.addEventListener("click", () => { s.activeCase = parseInt(b.dataset.case,10); renderProblemDetail(app, id); }));

  attachSplitterDrag(document.getElementById("lc-splitter-v"), document.getElementById("lc-body"), "horizontal", (pct) => {
    s.leftWidth = pct;
    document.getElementById("lc-left").style.flexBasis = pct + "%";
  });
  attachSplitterDrag(document.getElementById("lc-splitter-h"), document.getElementById("lc-right"), "vertical", (pct) => {
    s.editorHeight = pct;
    document.getElementById("lc-editor-pane").style.flexBasis = pct + "%";
  });
}

function renderProblemDescription(problem){
  return `
    <h2>${escapeHtml(problem.title)}</h2>
    <p>${escapeHtml(problem.description)}</p>
    <div class="lc-tag-row">${problem.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
  `;
}

function renderHintPanel(s){
  if(s.hintLoading) return `<p class="muted"><span class="spinner"></span>Consulting the mentor…</p>`;
  if(!s.hint) return `<p class="muted">Stuck? Pick a hint level up top and ask the mentor for a nudge — it's built to guide you, not just hand you the answer.</p>`;
  return `<p style="white-space:pre-wrap;">${escapeHtml(s.hint)}</p>`;
}

function renderConsoleBody(problem, s){
  if(s.consoleTab === "testcase"){
    const t = problem.tests[s.activeCase] || problem.tests[0];
    return `
      <div class="lc-case-row">
        ${problem.tests.map((_,i) => `<button class="lc-case-btn ${s.activeCase===i?'active':''}" data-case="${i}">Case ${i+1}</button>`).join("")}
      </div>
      <div class="lc-case-body">
        <div class="lc-case-label">Input</div>
        <div class="lc-case-value">${escapeHtml(t.input)}</div>
      </div>
    `;
  }
  // result tab
  if(s.running) return `<p class="muted" style="padding:1rem;"><span class="spinner"></span>Running against ${problem.tests.length} test case(s)…</p>`;
  if(!s.results) return `<p class="muted" style="padding:1rem;">Run or Submit to see results here.</p>`;
  const allPass = s.results.every(r => r.pass);
  return `
    <p class="lc-result-summary ${allPass ? 'signal2' : 'warn'}">${allPass ? "✓ Accepted" : "✗ Wrong Answer"}</p>
    <div class="lc-case-row">
      ${s.results.map((r,i) => `<button class="lc-case-btn ${s.activeCase===i?'active':''} ${r.pass?'':'warn'}" data-case="${i}">Case ${i+1} ${r.pass?'✓':'✗'}</button>`).join("")}
    </div>
    <div class="lc-case-body">
      ${renderCaseResult(problem, s)}
    </div>
  `;
}

function renderCaseResult(problem, s){
  const i = s.activeCase < s.results.length ? s.activeCase : 0;
  const r = s.results[i];
  const t = problem.tests[i];
  return `
    <div class="lc-case-label">Input</div>
    <div class="lc-case-value">${escapeHtml(t.input)}</div>
    <div class="lc-case-label">Output</div>
    <div class="lc-case-value">${escapeHtml(r.actual)}</div>
    <div class="lc-case-label">Expected</div>
    <div class="lc-case-value">${escapeHtml(r.expected)}</div>
    ${r.error ? `<div class="lc-case-label warn">Error</div><div class="lc-case-value">${escapeHtml(r.error)}</div>` : ""}
  `;
}

async function runProblemCode(app, problem, s, isSubmit){
  s.running = true; s.results = null; s.consoleTab = "result"; s.activeCase = 0;
  renderProblemDetail(app, problem.id);

  const results = [];
  for(const test of problem.tests){
    const harness = buildHarness(problem, test);
    const full = s.code + "\n" + harness;
    const run = await runPython(full).catch(err => ({ stdout: "", stderr: String(err), ok: false }));
    const actual = (run.stdout || "").trim();
    const pass = run.ok && actual === test.expected.trim();
    results.push({ pass, expected: test.expected, actual: run.ok ? actual : "(error)", error: run.ok ? "" : run.stderr });
  }
  s.results = results;
  s.running = false;

  const allPass = results.every(r => r.pass);
  if(isSubmit){
    const progress = await getProgress(CURRENT_USER.id);
    const entry = progress[problem.id] || { solved: false, attempts: 0, hintsUsed: 0 };
    entry.attempts += 1;
    if(allPass) entry.solved = true;
    progress[problem.id] = entry;
    await saveProgress(CURRENT_USER.id, progress);
    toast(allPass ? `${problem.title} solved! 🎉` : "Not quite — check the failing tests.", !allPass);
  } else {
    toast(allPass ? "All sample tests passed." : "Some sample tests failed.", !allPass);
  }

  renderProblemDetail(app, problem.id);
}

async function getProblemHint(app, problem, s){
  s.hintLoading = true; s.leftTab = "hint";
  renderProblemDetail(app, problem.id);
  try{
    s.hint = await generateHint(problem.description, s.code, s.hintLevel);
    const progress = await getProgress(CURRENT_USER.id);
    const entry = progress[problem.id] || { solved: false, attempts: 0, hintsUsed: 0 };
    entry.hintsUsed += 1;
    progress[problem.id] = entry;
    await saveProgress(CURRENT_USER.id, progress);
  }catch(err){
    toast(err.message || "Couldn't reach the mentor.", true);
  }finally{
    s.hintLoading = false;
    renderProblemDetail(app, problem.id);
  }
}

// Lightweight drag-to-resize splitter. Updates the DOM directly during
// drag (no re-render) so dragging stays smooth, and commits the final
// percentage into state via onChange so it survives re-renders.
function attachSplitterDrag(handle, container, axis, onChange){
  if(!handle || !container) return;
  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handle.classList.add("dragging");
    const rect = container.getBoundingClientRect();
    function move(ev){
      let pct = axis === "horizontal"
        ? ((ev.clientX - rect.left) / rect.width) * 100
        : ((ev.clientY - rect.top) / rect.height) * 100;
      pct = Math.max(20, Math.min(80, pct));
      onChange(pct);
    }
    function up(){
      handle.classList.remove("dragging");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}
